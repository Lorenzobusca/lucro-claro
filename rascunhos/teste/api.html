<!doctype html><meta charset="utf-8"><pre id="o">rodando</pre>
<script type="module">
const arquivos = ['_lib/comum.js', 'assinar.js', 'cancelar.js', 'excluir-conta.js', 'webhook-asaas.js'];
const linhas = [];
for (const a of arquivos) {
  try { const m = await import('/app/api/' + a); linhas.push(`${a}: ok (${Object.keys(m).join(', ')})`); }
  catch (e) { linhas.push(`${a}: ERRO ${e.message}`); }
}
/* Testa as contas de data do webhook */
const { depoisDoCiclo, diaEmSP } = await import('/app/api/_lib/comum.js');
linhas.push(`mensal de 2026-11-30 + 3 dias de folga = ${depoisDoCiclo('2026-11-30', 'mensal', 3).toISOString()}`);
linhas.push(`mensal de 2026-01-31 = ${depoisDoCiclo('2026-01-31', 'mensal').toISOString().slice(0, 10)}`);
linhas.push(`mensal de 2028-01-31 (ano bissexto) = ${depoisDoCiclo('2028-01-31', 'mensal').toISOString().slice(0, 10)}`);
linhas.push(`anual de 2028-02-29 = ${depoisDoCiclo('2028-02-29', 'anual').toISOString().slice(0, 10)}`);
linhas.push(`anual de 2026-11-12 = ${depoisDoCiclo('2026-11-12', 'anual').toISOString().slice(0, 10)}`);
linhas.push(`hoje em São Paulo = ${diaEmSP()}`);
document.getElementById('o').textContent = linhas.join('\n');
</script>
