name: Atualizar taxas

on:
  schedule:
    - cron: "17 11 * * 1-5"   # dias úteis, 08:17 em Brasília
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar-taxas.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compartilhado/data/taxas.json
          git diff --cached --quiet || git commit -m "Atualiza taxas do Banco Central"
          git push
